    // Configure Chart.js defaults for dark theme
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";

    function setLang(lang) {
        currentLang = lang;
        
        // Update Buttons Styling
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('bg-sky-500', 'text-white');
            btn.classList.add('bg-slate-700', 'text-slate-300');
        });
        const activeBtn = document.getElementById(`btn-${lang}`);
        activeBtn.classList.remove('bg-slate-700', 'text-slate-300');
        activeBtn.classList.add('bg-sky-500', 'text-white');

        // Update Text Elements
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        // Update Chart Labels if initialized
        if(chartInstance) {
            chartInstance.options.scales.x.title.text = translations[lang].chart_x;
            chartInstance.options.scales.y.title.text = translations[lang].chart_y;
            chartInstance.data.datasets[0].label = translations[lang].meas_data;
            chartInstance.data.datasets[1].label = translations[lang].true_data;
            chartInstance.update('none');
        }
        
        updateStatusUI();
        updateAnalysis();
    }

    function updateAnalysis() {
        const hasAC = document.getElementById('chk_ac').checked;
        const duration = parseFloat(document.getElementById('durInput').value);
        const overlayDiv = document.getElementById('ac_overlay');
        const contentDiv = document.getElementById('analysis_content');
        
        if (!hasAC) {
            overlayDiv.classList.add('hidden');
            return;
        }

        overlayDiv.classList.remove('hidden');

        const f = 50;
        const T = 1 / f;
        const cycles = Math.round(duration / T);

        contentDiv.innerHTML = `
            <div class="flex justify-between items-center mb-1">
                <span class="text-sky-400 font-semibold" data-i18n="freq_ac">${translations[currentLang].freq_ac}:</span>
                <span class="text-slate-100">50 Hz</span>
            </div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-sky-400 font-semibold" data-i18n="period_calc">${translations[currentLang].period_calc}:</span>
                <span class="text-slate-100">0.02 s</span>
            </div>
            <div class="flex justify-between items-center mb-1">
                <span class="text-sky-400 font-semibold" data-i18n="dur_simple">${translations[currentLang].dur_simple}:</span>
                <span class="text-slate-100">${duration.toFixed(1)} s</span>
            </div>
            <div class="flex justify-between items-center pt-1.5 mt-1.5 border-t border-slate-600">
                <span class="text-emerald-400 font-bold" data-i18n="total_cycles">${translations[currentLang].total_cycles}:</span>
                <span class="text-emerald-400 font-bold text-xs">${cycles}</span>
            </div>
        `;
    }

    function updateStatusUI() {
        const downloadBtn = document.getElementById('downloadBtn');
        const statusBadge = document.getElementById('statusBadge');
        
        statusBadge.textContent = translations[currentLang][`status_${currentStatus}`];
        
        if (currentStatus === 'ready') {
            statusBadge.className = "text-[10px] font-normal text-slate-400 bg-slate-900 px-2 py-1 rounded-full border border-slate-700 transition-colors";
            downloadBtn.disabled = true;
            downloadBtn.className = "bg-slate-700 text-slate-500 cursor-not-allowed font-medium py-1.5 px-3 rounded text-xs transition-all flex items-center gap-1.5 border border-slate-600";
        } else if (currentStatus === 'acq') {
            statusBadge.className = "text-[10px] font-normal text-sky-400 bg-slate-900 px-2 py-1 rounded-full border border-sky-900 animate-pulse transition-colors";
            downloadBtn.disabled = true;
            downloadBtn.className = "bg-slate-700 text-slate-500 cursor-not-allowed font-medium py-1.5 px-3 rounded text-xs transition-all flex items-center gap-1.5 border border-slate-600";
        } else if (currentStatus === 'done') {
            statusBadge.className = "text-[10px] font-normal text-emerald-400 bg-slate-900 px-2 py-1 rounded-full border border-emerald-900 transition-colors";
            downloadBtn.disabled = false;
            downloadBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1.5 px-3 rounded text-xs transition-colors shadow-lg shadow-emerald-900/50 flex items-center gap-1.5 border border-emerald-500";
        }
    }

    // Gaussian noise generation using Box-Muller transform
    function randomGaussian(mean, stdDev) {
        let u1 = Math.random();
        let u2 = Math.random();
        let randStdNormal = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
        return mean + stdDev * randStdNormal;
    }

    // Input Sync Logic
    function syncInputs(sliderId, inputId) {
        const slider = document.getElementById(sliderId);
        const input = document.getElementById(inputId);
        slider.addEventListener('input', (e) => {
            input.value = e.target.value;
            generateData();
            updateAnalysis();
        });
        input.addEventListener('input', (e) => {
            slider.value = e.target.value;
            generateData();
            updateAnalysis();
        });
    }

    function resetChartDisplay() {
        if(animationInterval) clearInterval(animationInterval);
        const duration = parseFloat(document.getElementById('durInput').value);
        
        // Dynamic sampling rate based on duration to prevent aliasing (500 Hz sampling rate)
        const sampleRate = 500; 
        const timeSteps = Math.floor(duration * sampleRate);
        
        chartInstance.data.labels = Array.from({length: timeSteps}, (_, i) => (i / sampleRate).toFixed(3));
        chartInstance.data.datasets[0].data = [];
        chartInstance.data.datasets[1].data = [];
        chartInstance.update('none');
        
        currentStatus = 'ready';
        updateStatusUI();
    }

    // Signal and data generation
    function generateData() {
        const duration = parseFloat(document.getElementById('durInput').value);
        const freq = parseFloat(document.getElementById('freqInput').value);
        const damp = parseFloat(document.getElementById('dampInput').value);
        
        // High frequency sampling (500 Hz) to accurately capture 50Hz AC and Bearing impacts
        const sampleRate = 500; 
        const timeSteps = Math.floor(duration * sampleRate); 
        
        // Read checkbox states
        const hasWhite = document.getElementById('chk_white').checked;
        const hasChassis = document.getElementById('chk_chassis').checked;
        const hasAC = document.getElementById('chk_ac').checked;
        const hasBearing = document.getElementById('chk_bearing').checked;
        const hasUnbalance = document.getElementById('chk_unbalance').checked;

        fullData.t = [];
        fullData.measured = [];
        fullData.trueSignal = [];

        for (let i = 0; i < timeSteps; i++) {
            let t = i / sampleRate;
            
            // True signal: Damped oscillation
            let trueVal = 150 * Math.exp(-damp * t) * Math.sin(2 * Math.PI * freq * t);
            
            // Compile noise and disturbances based on user selection
            let noise = 0;
            
            if (hasWhite) {
                // Sensor noise simulation (standard deviation = 5)
                noise += randomGaussian(0, 5); 
            }
            
            if (hasChassis) {
                // Structural low-frequency rumble (mixed 3.2 Hz and 6.5 Hz)
                noise += 10 * Math.sin(2 * Math.PI * 3.2 * t) + 8 * Math.sin(2 * Math.PI * 6.5 * t);
            }
            
            if (hasAC) {
                // Pure 50 Hz grid leakage
                noise += 15 * Math.sin(2 * Math.PI * 50 * t);
            }
            
            if (hasUnbalance) {
                // 1x RPM sinusoidal unbalance (simulated fixed shaft at 12 Hz)
                noise += 25 * Math.sin(2 * Math.PI * 12 * t);
            }
            
            if (hasBearing) {
                // High-frequency ring-down impacts (10 impacts per second)
                let impactFreq = 10; 
                let decay = 80; 
                let ringFreq = 180; // Resonance of the bearing
                let phase = (t * impactFreq) % 1.0; 
                noise += 40 * Math.exp(-phase * decay) * Math.sin(2 * Math.PI * ringFreq * (phase/impactFreq));
            }

            let measuredVal = trueVal + noise;

            fullData.t.push(t.toFixed(3)); 
            fullData.trueSignal.push(trueVal);
            fullData.measured.push(measuredVal);
        }

        currentData = fullData; // Keep for CSV download
        startOscilloscope(duration);
    }

    // Simulate real-time oscilloscope sweep
    function startOscilloscope(duration) {
        currentStatus = 'acq';
        updateStatusUI();

        if (!chartInstance) drawChart();

        // Reset chart data but keep labels
        chartInstance.data.labels = fullData.t;
        chartInstance.data.datasets[0].data = [];
        chartInstance.data.datasets[1].data = [];
        chartInstance.update();

        let currentIndex = 0;
        const totalPoints = fullData.t.length;
        const fps = 60; 
        const drawInterval = 1000 / fps; 
        // Calculate points dynamically based on actual array length to ensure exact duration
        const pointsPerFrame = Math.ceil(totalPoints / (duration * fps)); 

        if (animationInterval) clearInterval(animationInterval);

        animationInterval = setInterval(() => {
            let limit = Math.min(currentIndex + pointsPerFrame, totalPoints);
            for (let i = currentIndex; i < limit; i++) {
                chartInstance.data.datasets[0].data.push(fullData.measured[i]);
                chartInstance.data.datasets[1].data.push(fullData.trueSignal[i]);
            }
            
            chartInstance.update('none'); 
            currentIndex = limit;

            if (currentIndex >= totalPoints) {
                clearInterval(animationInterval);
                currentStatus = 'done';
                updateStatusUI();
            }
        }, drawInterval);
    }

    // Draw Chart.js in Dark Mode
    function drawChart() {
        const ctx = document.getElementById('strainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Measured Data (Noisy)',
                        data: [],
                        borderColor: 'rgba(148, 163, 184, 0.5)', 
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.1,
                        order: 2 
                    },
                    {
                        label: 'True Signal (Theoretical)',
                        data: [],
                        borderColor: '#38bdf8', 
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.1,
                        order: 1 
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: {
                        title: { display: true, text: 'Time (s)', color: '#94a3b8' },
                        grid: { color: '#334155', drawBorder: false },
                        ticks: { maxTicksLimit: 10, maxRotation: 0, color: '#94a3b8' }
                    },
                    y: {
                        title: { display: true, text: 'Microstrain (με)', color: '#94a3b8' },
                        min: -200, 
                        max: 200,  
                        grid: { color: '#334155', drawBorder: false },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#cbd5e1', usePointStyle: true, boxWidth: 8 } },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)', 
                        titleColor: '#f8fafc', bodyColor: '#cbd5e1',
                        borderColor: '#334155', borderWidth: 1, padding: 10
                    }
                }
            }
        });
    }

    // CSV Download Function
    function downloadCSV() {
        // Build header based on language
        let csvContent = "data:text/csv;charset=utf-8,";
        if(currentLang === 'EN') csvContent += "Time_s,Microstrain_uE\n";
        else if (currentLang === 'TR') csvContent += "Zaman_s,Mikrogerinim_uE\n";
        else if (currentLang === 'DE') csvContent += "Zeit_s,Mikrodehnung_uE\n";
        else if (currentLang === 'IT') csvContent += "Tempo_s,Microdeformazione_uE\n";
        
        for (let i = 0; i < currentData.t.length; i++) {
            csvContent += currentData.t[i] + "," + currentData.measured[i].toFixed(2) + "\n";
        }
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "strain_gauge_data.csv");
        document.body.appendChild(link);
        
        link.click();
        document.body.removeChild(link);
    }

    // Initialize 
    window.onload = () => {
        syncInputs('freqSlider', 'freqInput');
        syncInputs('dampSlider', 'dampInput');
        syncInputs('durSlider', 'durInput');
        
        // Add listeners for noise checkboxes to reset chart
        ['chk_white', 'chk_chassis', 'chk_ac', 'chk_bearing', 'chk_unbalance'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                generateData();
                updateAnalysis();
            });
        });
        
        drawChart();
        setLang('EN'); // Initialize translation
        updateAnalysis();
        
        // Auto-start simulation on load
        generateData();
    };
</script>
